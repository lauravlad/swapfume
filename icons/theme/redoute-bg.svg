<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700">
  <!-- Swapfume theme art: an original rose branch in the manner of a stipple-engraved botanical plate. Drawn for Swapfume, not copied. -->
  <defs>
    <radialGradient id="wash" cx="50%" cy="60%" r="60%">
      <stop offset="0" stop-color="#F7D7DB" stop-opacity=".8"/>
      <stop offset="1" stop-color="#F7D7DB" stop-opacity="0"/>
    </radialGradient>
    <g id="petal"><path d="M0 0C-62-8-96-58-66-98C-36-126 20-118 32-84C44-52 26-14 0 0Z"/></g>
    <g id="leaflet">
      <path d="M0 0C14-14 38-16 56 0C38 15 14 14 0 0Z" fill="#B9CFA3" stroke="#6F8F5A" stroke-width="1.1"/>
      <path d="M2 0H52M14 0l6-6M24 0l6-7M34 0l6-6M14 0l6 6M24 0l6 7M34 0l6 6" fill="none" stroke="#6F8F5A" stroke-width=".7"/>
      <path d="M4 3C16 10 36 10 52 2" fill="none" stroke="#8FAE79" stroke-width=".6" stroke-dasharray="1 3"/>
    </g>
    <g id="leaf">
      <path d="M0 0L70 0" stroke="#6F8F5A" stroke-width="1.4"/>
      <use href="#leaflet" transform="translate(66 0) scale(.95)"/>
      <use href="#leaflet" transform="translate(44 -2) rotate(-48) scale(.8)"/>
      <use href="#leaflet" transform="translate(44 2) rotate(48) scale(.8)"/>
      <use href="#leaflet" transform="translate(20 -2) rotate(-58) scale(.68)"/>
      <use href="#leaflet" transform="translate(20 2) rotate(58) scale(.68)"/>
    </g>
    <g id="bud">
      <path d="M0 0C-14-12-16-34 0-50C16-34 14-12 0 0Z" fill="#EFA8B4" stroke="#B5566B" stroke-width="1.1"/>
      <path d="M0-48C-4-36-4-18 0-4" fill="none" stroke="#C9768A" stroke-width=".9"/>
      <path d="M0 0C-12-6-20-20-22-34C-12-24-6-14 0 0ZM0 0C12-6 20-20 22-34C12-24 6-14 0 0Z" fill="#9DBB86" stroke="#6F8F5A" stroke-width=".8"/>
    </g>
  </defs>

  <ellipse cx="400" cy="470" rx="210" ry="190" fill="url(#wash)"/>

  <!-- stems with thorns -->
  <g fill="none" stroke="#7E9A66" stroke-width="5" stroke-linecap="round">
    <path d="M610 720C540 660 470 590 410 500"/>
    <path d="M520 640C470 610 420 600 330 620"/>
    <path d="M455 560C430 480 440 380 480 300"/>
  </g>
  <g fill="#8C6A4E">
    <path d="M560 680l14-6-9 12z"/><path d="M500 610l-14-3 11 10z"/><path d="M440 610l-6 12 11-6z"/>
    <path d="M447 470l-13-4 10 10z"/><path d="M451 400l13-6-9 12z"/>
  </g>

  <!-- leaves -->
  <use href="#leaf" transform="translate(520 640) rotate(150)"/>
  <use href="#leaf" transform="translate(480 600) rotate(70) scale(.9)"/>
  <use href="#leaf" transform="translate(330 620) rotate(195) scale(.85)"/>
  <use href="#leaf" transform="translate(450 450) rotate(-160) scale(.8)"/>
  <use href="#leaf" transform="translate(458 360) rotate(-20) scale(.75)"/>

  <!-- buds -->
  <use href="#bud" transform="translate(480 300) rotate(18)"/>
  <use href="#bud" transform="translate(330 620) rotate(-80) scale(.8)"/>

  <!-- the open rose -->
  <g transform="translate(400 470)">
    <g fill="#F6CDD3" stroke="#C98692" stroke-width="1.2">
      <use href="#petal" transform="rotate(0)"/><use href="#petal" transform="rotate(72)"/>
      <use href="#petal" transform="rotate(144)"/><use href="#petal" transform="rotate(216)"/>
      <use href="#petal" transform="rotate(288)"/>
    </g>
    <g fill="#F1B3BF" stroke="#BD6E80" stroke-width="1.1">
      <use href="#petal" transform="rotate(36) scale(.72)"/><use href="#petal" transform="rotate(108) scale(.72)"/>
      <use href="#petal" transform="rotate(180) scale(.72)"/><use href="#petal" transform="rotate(252) scale(.72)"/>
      <use href="#petal" transform="rotate(324) scale(.72)"/>
    </g>
    <path d="M-44-6C-46-48-10-62 8-54C36-62 50-32 44-4C36 24-36 24-44-6Z" fill="#E994A5" stroke="#B5566B" stroke-width="1.2"/>
    <g fill="none" stroke="#A84862" stroke-width="1.3" stroke-linecap="round">
      <path d="M-22-14C-20-34 6-40 18-26"/><path d="M-10-10C-6-24 10-24 12-12"/>
      <path d="M-30 2C-18 14 18 14 30 0"/><path d="M-2-18C2-14 4-8 0-4"/>
    </g>
    <!-- stipple shading -->
    <g fill="#B5566B" opacity=".55">
      <circle cx="-70" cy="-30" r="1.2"/><circle cx="-64" cy="-22" r="1"/><circle cx="-74" cy="-14" r="1.1"/><circle cx="-58" cy="-38" r=".9"/>
      <circle cx="62" cy="-26" r="1.1"/><circle cx="70" cy="-16" r="1"/><circle cx="56" cy="-10" r="1.2"/><circle cx="66" cy="-36" r=".9"/>
      <circle cx="-20" cy="60" r="1.1"/><circle cx="-8" cy="66" r="1"/><circle cx="6" cy="62" r="1.2"/><circle cx="18" cy="68" r=".9"/>
      <circle cx="-40" cy="44" r="1"/><circle cx="40" cy="46" r="1.1"/><circle cx="-6" cy="-70" r="1"/><circle cx="10" cy="-76" r=".9"/>
      <circle cx="-30" cy="24" r=".8"/><circle cx="28" cy="26" r=".8"/><circle cx="-36" cy="-2" r=".8"/><circle cx="34" cy="-6" r=".8"/>
    </g>
  </g>

  <!-- engraver's dotted ground line and fallen petal -->
  <path d="M220 690C300 676 380 680 470 692" fill="none" stroke="#B8A58C" stroke-width="1.2" stroke-dasharray="1 5" stroke-linecap="round"/>
  <path d="M250 660c14-12 34-10 40 2-12 10-28 10-40-2z" fill="#F6CDD3" stroke="#C98692" stroke-width="1"/>
</svg>
